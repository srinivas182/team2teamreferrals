# CI rules (agreed): draft PRs run only quick checks; the full suite runs when a PR is ready;
# nothing re-runs on main after merge; superseded runs are cancelled; docs-only changes skip.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '22'

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      code: ${{ steps.diff.outputs.code }}
      docker: ${{ steps.diff.outputs.docker }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: diff
        run: |
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$files"
          code=false; docker=false; web=false
          if echo "$files" | grep -qvE '^(docs/|brand/|design/|prototype/|tools/brand/|.*\.md$)'; then code=true; fi
          # New PHP or JavaScript dependencies change what goes into the image, so they rebuild it too.
          if echo "$files" | grep -qE '^(docker/|compose\.yaml$|compose\.prod\.yaml$|composer\.(json|lock)$|package(-lock)?\.json$)'; then docker=true; fi
          # Lighthouse only when public-facing code changes (saves Actions minutes on back-end work).
          if echo "$files" | grep -qE '^(resources/|public/|routes/web\.php|app/Domains/Seo/|vite\.config|package(-lock)?\.json|lighthouserc\.json)'; then web=true; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "docker=$docker" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"

  quick:
    name: Quick checks (style, static analysis, types)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: { php-version: '${{ env.PHP_VERSION }}', coverage: none, tools: composer:v2 }
      - uses: actions/cache@v6
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/pint --test
      - run: php -d memory_limit=1G vendor/bin/phpstan analyse --no-progress
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run types
      - run: npm run format:check
      - name: Theme matches design tokens
        run: npm run tokens && git diff --exit-code resources/css/theme.css
      - name: Component tests with accessibility checks
        run: npm test

  full:
    name: Tests and build
    needs: [changes, quick]
    if: needs.changes.outputs.code == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # A real ClickHouse, so the analytics store and the 10-million-event speed target are tested, not assumed.
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        ports: ['8123:8123']
        env:
          CLICKHOUSE_USER: ci
          CLICKHOUSE_PASSWORD: ci-password
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping || exit 1" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CLICKHOUSE_URL: http://127.0.0.1:8123
      CLICKHOUSE_USER: ci
      CLICKHOUSE_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@v7
      - name: Image rendering for share cards (librsvg, Inter font)
        # Each attempt is time-limited so a hanging mirror fails fast; if the runner's Azure mirror fails, fall back to the
        # official Ubuntu archive. A package-mirror outage must not block every pull request: the step is non-blocking,
        # the rendering test skips itself without the tool, and a warning below makes the gap visible on the run.
        id: rsvg
        continue-on-error: true
        timeout-minutes: 7
        run: |
          for mirror in "" "http://archive.ubuntu.com/ubuntu"; do
            if [ -n "$mirror" ]; then
              echo "Azure mirror failed; switching to $mirror"
              sudo sed -i "s#http://azure.archive.ubuntu.com/ubuntu#$mirror#g" /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            fi
            if timeout 150 sudo apt-get -o Acquire::Retries=3 update -q \
              && timeout 150 sudo apt-get -o Acquire::Retries=3 install -y -q --no-install-recommends librsvg2-bin fonts-inter; then
              exit 0
            fi
          done
          exit 1
      - name: Warn when share-card rendering can't be tested
        if: steps.rsvg.outcome != 'success'
        run: echo "::warning title=Share-card rendering not tested::The Ubuntu package mirror was unavailable, so rsvg-convert isn't installed and the rendering test is skipped on this run. The Docker image build still renders with it."
      - uses: shivammathur/setup-php@v2
        with: { php-version: '${{ env.PHP_VERSION }}', coverage: none, tools: composer:v2 }
      - uses: actions/cache@v6
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - name: Build client and server-rendered bundles
        run: npm run build
      - name: Prepare environment
        run: cp .env.example .env && php artisan key:generate
      - name: Tests
        run: vendor/bin/pest --compact
      - name: "Analytics speed check (10 million events, ClickHouse, under 250 ms, a 2x margin on the PRD's 500)"
        run: php artisan t2t:analytics benchmark --clickhouse-url="$CLICKHOUSE_URL" --clickhouse-user="$CLICKHOUSE_USER" --clickhouse-password="$CLICKHOUSE_PASSWORD"

  docker:
    name: Docker image builds
    needs: changes
    if: needs.changes.outputs.docker == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - run: docker compose config --quiet && cp .env.example .env && MEILISEARCH_KEY=ci-config-check docker compose -f compose.prod.yaml config --quiet
      - run: docker build -f docker/dev/Dockerfile .
      - name: Production image (Octane on FrankenPHP)
        uses: docker/build-push-action@v6
        with: { context: ., file: docker/prod/Dockerfile, target: app, push: false, cache-from: type=gha, cache-to: 'type=gha,mode=max' }

  performance:
    name: Performance budgets (Lighthouse)
    needs: changes
    if: needs.changes.outputs.web == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: { php-version: '${{ env.PHP_VERSION }}', coverage: none, tools: composer:v2 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci && npm run build
      - name: Serve the app (production mode, SQLite)
        run: |
          cp .env.example .env && php artisan key:generate
          sed -i 's/^APP_ENV=.*/APP_ENV=production/; s/^APP_DEBUG=.*/APP_DEBUG=false/; s/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/; s/^SESSION_DRIVER=.*/SESSION_DRIVER=file/; s/^CACHE_STORE=.*/CACHE_STORE=file/' .env
          touch database/database.sqlite && php artisan migrate --force && php artisan optimize
          (php artisan inertia:start-ssr &) && (php artisan serve --port=8000 &) && sleep 4
      - run: npx --yes @lhci/cli@0.15.1 autorun

